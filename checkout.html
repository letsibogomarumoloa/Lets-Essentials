<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Lets Essentials | Checkout
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body>



<header>

<nav class="navbar">


<div class="logo">

<img src="images/logo.png">

<h2>
Lets Essentials
</h2>

</div>


<ul>

<li>
<a href="shop.html">
Back To Shop
</a>
</li>


<li>
<a href="account.html">
My Account
</a>
</li>


</ul>


</nav>


</header>







<section class="booking-section">


<h2>
Complete Your Order
</h2>




<form id="checkoutForm">



<input

type="text"

id="customerName"

placeholder="Full Name"

required>




<input

type="tel"

id="customerPhone"

placeholder="Phone Number"

required>





<input

type="text"

id="deliveryAddress"

placeholder="Delivery Address"

required>






<select id="deliveryMethod">


<option value="Delivery">

Home Delivery

</option>


<option value="Collection">

Store Collection

</option>



</select>







<select id="paymentMethod">


<option>

Cash

</option>


<option>

Mobile Payment

</option>


<option>

Bank Transfer

</option>


</select>







<button class="btn">

Place Order

</button>



</form>





<div id="orderMessage"></div>



</section>









<section>


<h2>
Your Cart
</h2>



<div id="checkoutCart">

</div>



<h3 id="checkoutTotal">

Total: P0

</h3>



</section>






<footer>

<p>

© 2026 Lets Essentials

</p>

</footer>




<script src="js/checkout.js"></script>


</body>

</html>
