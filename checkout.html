<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Lets Essentials | Checkout
</title>


<link rel="stylesheet" href="css/style.css">


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>



<body>


<!-- HEADER -->


<header id="header">

<div class="container">

<nav class="navbar">


<a href="index.html" class="logo">


<img src="images/logo.png"
alt="Lets Essentials Logo">


<div>

<h2>
Lets Essentials
</h2>

<span>
Putting Smiles On Faces
</span>

</div>


</a>




<ul class="nav-links">


<li>
<a href="index.html">
Home
</a>
</li>


<li>
<a href="shop.html">
Shop
</a>
</li>


<li>
<a href="cart.html">
Cart
</a>
</li>


</ul>




<button id="menuBtn"
class="menu-btn">

<i class="fa-solid fa-bars"></i>

</button>


</nav>

</div>

</header>









<!-- CHECKOUT HERO -->


<section class="hero">


<div class="container">


<div class="hero-content">


<span class="hero-tag">

CHECKOUT

</span>


<h1>

Complete Your Order

</h1>


<p>

Provide your details and we will prepare your order.

</p>


</div>


</div>


</section>









<!-- CHECKOUT AREA -->


<section class="checkout-section">


<div class="container">


<div class="checkout-layout">







<!-- CUSTOMER FORM -->


<div class="checkout-box">


<h2>
Customer Details
</h2>



<form id="checkoutForm">



<input type="text"
id="checkoutName"
placeholder="Full Name"
required>




<input type="tel"
id="checkoutPhone"
placeholder="Phone Number"
required>




<input type="email"
id="checkoutEmail"
placeholder="Email Address"
required>




<textarea id="checkoutAddress"
placeholder="Delivery Address"
required></textarea>






<select id="paymentMethod"
required>


<option value="">
Select Payment Method
</option>


<option>
Cash On Delivery
</option>


<option>
Mobile Money
</option>


<option>
Bank Transfer
</option>


</select>







<button class="btn btn-primary">

Place Order

</button>



</form>




<div id="orderMessage"></div>



</div>









<!-- ORDER SUMMARY -->


<div class="checkout-box">


<h2>

Your Order

</h2>



<div id="checkoutItems">

</div>




<hr>



<div class="summary-total">


<span>

Total

</span>


<strong id="checkoutTotal">

P0

</strong>



</div>



</div>





</div>


</div>


</section>







<footer class="footer">


<div class="container">


<p>

© 2026 Lets Essentials. All Rights Reserved.

</p>


</div>


</footer>







<script src="js/main.js"></script>

<script src="js/cart.js"></script>

<script src="js/checkout.js"></script>


</body>

</html>
