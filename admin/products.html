<!-- MAIN CONTENT -->


<main class="main-content">



<header class="topbar">


<div>


<h1>
Products
</h1>


<p>
Manage your store inventory
</p>


</div>



</header>







<section class="admin-content">







<!-- ADD PRODUCT -->


<div class="card">


<div class="card-title">


<h2>
Add New Product
</h2>


</div>





<form id="productForm" class="admin-form">



<input 
type="text"
id="productName"
placeholder="Product Name"
required>



<input 
type="number"
id="productPrice"
placeholder="Price"
required>



<input 
type="text"
id="productCategory"
placeholder="Category"
required>



<input 
type="number"
id="productStock"
placeholder="Stock Quantity"
required>



<input 
type="text"
id="productImage"
placeholder="Image path e.g images/products/item.jpg"
required>



<textarea
id="productDescription"
placeholder="Product Description">
</textarea>




<button class="btn btn-primary">

<i class="fas fa-plus"></i>

Add Product

</button>




</form>


<p id="productMessage"></p>


</div>









<!-- PRODUCT LIST -->


<div class="card">


<div class="card-title">


<h2>
Inventory
</h2>



<input 
type="search"
id="searchProducts"
placeholder="Search products...">


</div>





<div class="table-wrapper">



<table>


<thead>

<tr>


<th>
Image
</th>


<th>
Product
</th>


<th>
Category
</th>


<th>
Price
</th>


<th>
Stock
</th>


<th>
Actions
</th>


</tr>


</thead>



<tbody id="productsTable">


</tbody>



</table>



</div>


</div>

</div>
