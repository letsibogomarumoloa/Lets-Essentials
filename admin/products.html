<div class="dashboard-content">





<div class="table-card">


<h3>
Add New Product
</h3>



<form id="productForm">



<input 
type="text"
id="productName"
placeholder="Product Name"
required>



<input 
type="number"
id="productPrice"
placeholder="Price"
required>



<select id="productCategory">


<option>
Gadgets
</option>


<option>
Clothing
</option>


<option>
Sportswear
</option>


<option>
Pool Hub
</option>


</select>




<input 
type="text"
id="productImage"
placeholder="Image URL">





<button class="btn btn-primary">

Add Product

</button>



</form>


</div>



<br>





<div class="table-card">


<h3>
Available Products
</h3>




<table>


<thead>

<tr>

<th>
Image
</th>

<th>
Name
</th>

<th>
Category
</th>

<th>
Price
</th>

<th>
Action
</th>

</tr>

</thead>

</tbody>
