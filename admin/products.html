<header id="header">

<section class="services">


<div class="container">


<div class="section-title">


<span>
PRODUCT MANAGEMENT
</span>


<h2>
Store Products
</h2>


<p>
Add and manage products available in the store.
</p>


</div>







<!-- ADD PRODUCT FORM -->


<div class="checkout-box">



<h2>
Add Product
</h2>




<form id="productForm">



<input type="text"
id="productName"
placeholder="Product Name"
required>



<input type="number"
id="productPrice"
placeholder="Price"
required>



<select id="productCategory">


<option value="gadgets">
Gadgets
</option>


<option value="clothing">
Clothing
</option>


<option value="sportswear">
Sportswear
</option>


<option value="pool">
Pool Hub
</option>


</select>





<input type="text"
id="productImage"
placeholder="Image path e.g images/products/item.jpg">





<button class="btn btn-primary">

Add Product

</button>



</form>


</div>








<br>






<h2>
Current Products
</h2>



<div id="productsContainer">


</div>





</div>


</section>
