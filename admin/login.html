<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lets Essentials | Admin Login</title>

    <link rel="stylesheet" href="../css/admin.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-container">

    <div class="login-left">

        <div class="overlay">

            <img src="../images/logo.png" class="login-logo" alt="Lets Essentials Logo">

            <h1>Lets Essentials</h1>

            <p>
                Manage bookings, orders, products, customers and reports from one secure dashboard.
            </p>

        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <h2>Admin Login</h2>

            <p>Welcome back.</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">
                        👁
                    </button>

                </div>

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <button
                    class="login-btn"
                    type="submit">

                    Login

                </button>

            </form>

            <p id="loginMessage"></p>

            <a href="../index.html" class="back-home">
                ← Return to Website
            </a>

        </div>

    </div>

</div>

<script src="../js/login.js"></script>

</body>

</html>
