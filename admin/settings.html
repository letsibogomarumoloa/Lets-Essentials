</div>

<section class="admin-content">



<div class="card">


<div class="card-title">

<h2>
Store Information
</h2>

</div>





<form id="settingsForm" class="admin-form">



<input 
type="text"
id="storeName"
placeholder="Store Name">





<input 
type="text"
id="storeWhatsapp"
placeholder="WhatsApp Number">





<input 
type="email"
id="storeEmail"
placeholder="Email Address">





<input 
type="text"
id="storeLocation"
placeholder="Store Location">





<textarea
id="deliveryInfo"
placeholder="Delivery Information">
</textarea>





<textarea
id="aboutStore"
placeholder="About Store">
</textarea>





<button class="btn btn-primary">

<i class="fas fa-save"></i>

Save Settings

</button>




</form>


<p id="settingsMessage"></p>
