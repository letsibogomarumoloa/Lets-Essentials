<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Lets Essentials Dashboard
</title>


<link rel="stylesheet" href="../css/style.css">


<meta name="robots" content="noindex, nofollow">

</head>



<body>



<header id="header">


<div class="container">


<nav class="navbar">


<a href="dashboard.html" class="logo">


<img src="../images/logo.png" alt="Lets Essentials Logo">


<div>

<h2>
Admin Dashboard
</h2>

<span>
Lets Essentials
</span>


</div>


</a>




<button id="adminLogout" class="btn btn-secondary">

Logout

</button>



</nav>


</div>


</header>








<section class="services">


<div class="container">


<div class="section-title">


<span>
CONTROL PANEL
</span>


<h2>
Business Overview
</h2>


</div>







<div class="services-grid">



<div class="service-card">


<div class="service-icon">

<i class="fa-solid fa-cart-shopping"></i>

</div>


<h3>
Orders
</h3>


<p id="totalOrders">

0 Orders

</p>


<a href="orders.html" class="card-link">

Manage

</a>


</div>









<div class="service-card">


<div class="service-icon">

<i class="fa-solid fa-calendar"></i>

</div>


<h3>
Bookings
</h3>


<p id="totalBookings">

0 Bookings

</p>


<a href="bookings.html" class="card-link">

Manage

</a>


</div>









<div class="service-card">


<div class="service-icon">

<i class="fa-solid fa-box"></i>

</div>


<h3>
Products
</h3>


<p id="totalProducts">

0 Products

</p>


<a href="products.html" class="card-link">

Manage

</a>


</div>



</div>



<br><br>







<div class="checkout-box">


<h2>
Add New Product
</h2>



<form id="productForm">



<input 
type="text"
id="productName"
placeholder="Product Name"
required>



<input 
type="number"
id="productPrice"
placeholder="Price (P)"
required>



<input 
type="text"
id="productCategory"
placeholder="Category"
required>



<input 
type="text"
id="productImage"
placeholder="Image Path (example: images/products/item.jpg)"
required>



<input 
type="number"
id="productStock"
placeholder="Stock Quantity"
required>



<textarea
id="productDescription"
placeholder="Product Description">
</textarea>





<button class="btn btn-primary">

Add Product

</button>



</form>



<div id="productMessage"></div>



</div>






</div>


</section>







<script src="js/admin.js"></script>

<script src="js/products.js"></script>



</body>


</html>
