<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Lets Essentials | Register
</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<section class="tracking-section">


<div class="container">


<div class="tracking-box">


<h2>
Create Account
</h2>


<p>
Join Lets Essentials and manage your orders.
</p>



<form id="registerForm">


<input 
type="text"
id="registerName"
placeholder="Full Name"
required>



<input 
type="email"
id="registerEmail"
placeholder="Email Address"
required>



<input 
type="tel"
id="registerPhone"
placeholder="Phone Number"
required>



<input 
type="password"
id="registerPassword"
placeholder="Password"
required>




<button class="btn btn-primary">

Create Account

</button>



</form>




<div id="registerMessage"></div>




<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>



</div>


</div>


</section>




<script src="../js/auth.js"></script>


</body>

</html>
